# Use this file for local development (builds the image from source)
# docker compose -f docker-compose.build.yml up -d --build

services:
  meesman-tracker:
    build: .
    container_name: meesman-tracker
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Amsterdam
      - DB_PATH=/data/app.db
      - CONFIG_PATH=/data/config.yaml
      # ── Beveiliging (v10, aanbevolen — zie README) ──
      # - APP_USER=marc                      # Basic Auth voor alle pagina's
      # - APP_PASSWORD=kies-een-sterk-wachtwoord
      # - API_TOKEN=lange-willekeurige-string # voor Home Assistant (/api/*, exports)
      # - MASTER_KEY=...                     # waarde uit data/config.yaml (optioneel)
      # ── Non-root: uid/gid van de eigenaar van de data-map (zie `id`) ──
      # - PUID=1000
      # - PGID=1000
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
