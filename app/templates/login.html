{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block content %}

<div class="card" style="max-width:420px; margin:48px auto 0">
  <h2 style="margin:0 0 6px">Inloggen</h2>
  <p style="margin:0 0 14px; color:var(--muted)">Meesman Tracker</p>

  {% if error %}
    <p class="err" style="margin:0 0 12px"><strong>✗ {{ error }}</strong></p>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}" />
    <label for="username">Gebruikersnaam</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div style="margin-top:16px">
      <button type="submit" class="primary" style="width:100%">Inloggen</button>
    </div>
  </form>
</div>

{% endblock %}
