name: Meesman selector canary

# Dagelijkse controle of de Meesman-loginpagina nog de selectors bevat
# waar de scraper op vertrouwt. Faalt deze workflow, dan heeft Meesman
# de site gewijzigd — je krijgt dan een e-mail van GitHub vóórdat de
# NAS drie dagen lang mislukte refreshes stapelt.

on:
  schedule:
    - cron: "17 6 * * *"   # dagelijks 06:17 UTC (08:17 Amsterdam in de zomer)
  workflow_dispatch:        # ook handmatig te starten via de Actions-tab

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install "playwright==1.62.0" pyyaml
          python -m playwright install --with-deps --only-shell chromium

      - name: Check login page selectors
        run: python scripts/selector_canary.py
