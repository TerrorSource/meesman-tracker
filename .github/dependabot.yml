# Automatische update-PR's voor dependencies — gegroepeerd tot één PR per
# categorie per maand. De tests draaien op elke PR (zie docker.yml), dus de
# merge-knop is groen of rood vóór je klikt.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Playwright-upgrades brengen een nieuwe Chromium mee: bewust doen,
      # met lokale buildtest (zie README). Alleen patch-updates automatisch.
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Python-basisimage bewust vastzetten op 3.12: nieuwere versies missen
      # wheels voor gepinde packages en breken de build.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
