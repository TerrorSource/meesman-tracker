# Automatische update-PR's voor dependencies.
# Vooral Playwright/Chromium actueel houden is belangrijk voor
# scraping-betrouwbaarheid en security-patches.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
